name: skills-check

# Verify every published skill carries its direct resources, the complete suite
# installs, and installed units satisfy the open Agent Skills format.
on:
  push:
    paths:
      - "skills/**"
      - "evals/**"
      - ".claude-plugin/marketplace.json"
      - "scripts/build-skills.sh"
      - "scripts/test-build-skills.sh"
      - "scripts/check-vocabulary.mjs"
      - "scripts/check-skills-package.sh"
      - "scripts/test-scaffold-audit.sh"
      - "scripts/test-scaffold-converge.sh"
      - "scripts/test-derive-recipe.sh"
      - "scripts/test-detect-backend.sh"
      - ".github/workflows/skills-check.yml"
  pull_request:
    paths:
      - "skills/**"
      - "evals/**"
      - ".claude-plugin/marketplace.json"
      - "scripts/build-skills.sh"
      - "scripts/test-build-skills.sh"
      - "scripts/check-vocabulary.mjs"
      - "scripts/check-skills-package.sh"
      - "scripts/test-scaffold-audit.sh"
      - "scripts/test-scaffold-converge.sh"
      - "scripts/test-derive-recipe.sh"
      - "scripts/test-detect-backend.sh"
      - ".github/workflows/skills-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shared skill resources are in sync
        run: bash scripts/build-skills.sh --check

      - name: Generated-resource security fixtures
        run: bash scripts/test-build-skills.sh

      # C4/C6 of docs/decisions/claude-5-context-engineering.md: a skill schema
      # that restates a cross-skill enum must still match the canonical
      # declaration. Half-applied taxonomy changes are this repo's #1 bug class.
      - name: Cross-skill vocabulary agrees
        run: node scripts/check-vocabulary.mjs

      - name: Skill package is complete, bounded, and officially valid
        run: bash scripts/check-skills-package.sh

      - name: Scaffold converge regression fixtures
        run: bash scripts/test-scaffold-converge.sh

      - name: Scaffold audit regression fixtures
        run: bash scripts/test-scaffold-audit.sh

      - name: Verification-recipe derivation fixtures
        run: bash scripts/test-derive-recipe.sh

      # C2: the executor mode matrix is a table people reason about; these are
      # the executable half of it.
      - name: Backend detection fixtures
        run: bash scripts/test-detect-backend.sh

      # R7/R8 of docs/decisions/skill-authoring-standard.md: one corpus-wide
      # line budget for every SKILL.md — warn above 400, fail above 500.
      - name: SKILL.md line budget (warn >400, fail >500)
        run: |
          fail=0
          while IFS= read -r f; do
            n=$(wc -l < "$f")
            if [ "$n" -gt 500 ]; then
              echo "FAIL (>500): $n  $f"; fail=1
            elif [ "$n" -gt 400 ]; then
              echo "::warning file=$f::SKILL.md is $n lines (budget 400)"
            fi
          done < <(find skills -name SKILL.md -not -path '*/node_modules/*')
          exit $fail

      # C6 of docs/decisions/claude-5-context-engineering.md: ratchets, not
      # one-time cuts. These are the C-P1 baselines; they may fall, never rise.
      # A new prohibition is not forbidden — it just has to earn its place by
      # replacing one that had no check behind it.
      - name: Steering ratchets (negations, hard imperatives)
        run: |
          fail=0
          negations=$(grep -rniE "never |do not |don't |must not |avoid " skills --include=SKILL.md | wc -l | tr -d ' ')
          imperatives=$(grep -rnE "\bNEVER\b|\bMUST\b|\bALWAYS\b" skills --include=SKILL.md | wc -l | tr -d ' ')
          echo "steering: $negations negation lines, $imperatives hard imperatives (SKILL.md)"
          if [ "$negations" -gt 63 ]; then echo "FAIL: negation lines rose above 63: $negations"; fail=1; fi
          if [ "$imperatives" -gt 5 ]; then echo "FAIL: hard imperatives rose above 5: $imperatives"; fail=1; fi
          exit $fail

      # R8(b): the $BASE resolver block has exactly one canonical home —
      # git-ref's SKILL.md. The raw `aep.integration-branch` literal is
      # allowlisted in the three reference files that read the config key for
      # their own bash (executor backends probe, autopilot tick nudge prompt,
      # build harness-artifacts init.sh recovery script).
      - name: $BASE resolver lives only in git-ref
        run: |
          # Two signatures: the config-key literal AND the develop-probe bash
          # (a resolver copy that omits the config override still probes
          # refs/heads/develop — that spelling must not reappear either).
          bad=0
          while IFS= read -r f; do
            case "$f" in
              skills/agentic-development-workflow/git-ref/SKILL.md) ;;
              skills/patterns/executor/references/backends.md) ;;
              skills/patterns/autopilot/references/tick-protocol.md) ;;
              skills/agentic-development-workflow/build/references/harness-artifacts.md) ;;
              *) echo "FAIL: integration-branch resolver leaked into $f"; bad=1 ;;
            esac
          done < <({ grep -rl 'aep\.integration-branch' skills/ || true; grep -rlE 'refs/(heads|remotes/origin)/develop' skills/ || true; } | sort -u)
          exit $bad
