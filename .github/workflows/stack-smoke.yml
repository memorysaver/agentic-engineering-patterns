name: Web stack smoke
on:
  workflow_dispatch:
  pull_request:
    paths: ['skills/native/stack/**', '.github/scripts/stack-smoke.py', '.github/workflows/stack-smoke.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo build --locked --release -p aep-cli
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: python3 .github/scripts/stack-smoke.py --aep target/release/aep --workdir "$RUNNER_TEMP/stack-smoke"
